name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@b4de68f51a3609d37d0902c6a5760f95f9d0902c # v4
      - uses: actions/setup-python@65d7f2d534ac1bc67fcd62888c5f4f3d2cb2b236 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ruff mypy types-Pillow
      - run: ruff check .
      - run: mypy api/

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@b4de68f51a3609d37d0902c6a5760f95f9d0902c # v4
      - uses: actions/setup-python@65d7f2d534ac1bc67fcd62888c5f4f3d2cb2b236 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@b4de68f51a3609d37d0902c6a5760f95f9d0902c # v4
      - uses: docker/setup-buildx-action@2b51285047da1547cc430b0cb6d72dee02a72507 # v3
      - uses: docker/build-push-action@2cdde995de11925a030ce8070c3d77a52ffcf1c0 # v6
        with:
          context: .
          push: false
          tags: eth-ai-object-detection-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Docker smoke test
        run: |
          docker compose up -d
          sleep 10
          curl -sf http://localhost:8000/health || (docker compose logs && exit 1)
          docker compose down
