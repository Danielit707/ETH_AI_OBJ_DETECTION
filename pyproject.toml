[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eth-ai-object-detection"
version = "0.1.0"
description = "Adverse Weather Object Detection using YOLOv8 on the ACDC dataset"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "See License.pdf — ACDC dataset is non-commercial" }
authors = [{ name = "Danielit707" }]
keywords = ["object-detection", "yolov8", "acdc", "adverse-weather", "computer-vision"]

[project.optional-dependencies]
api = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.22",
    "python-multipart>=0.0.6",
    "pillow>=10.0",
    "requests>=2.31",
    "ultralytics>=8.0",
]
ui = [
    "customtkinter>=5.2",
    "httpx>=0.27",
]
test = [
    "fastapi>=0.100",
    "python-multipart>=0.0.6",
    "pillow>=10.0",
    "requests>=2.31",
    "httpx>=0.27",
    "pytest>=8.0",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.0",
]

[tool.setuptools]
packages = ["api"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
